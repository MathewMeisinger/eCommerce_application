{% extends 'base.html' %}


{% block title %}
    <title>Register</title>
{% endblock %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    {{ form.errors }}

    <div>
        <label>Username:</label><br>
        {{ form.username }}
    </div>

    <div>
        <label>Email:</label><br>
        {{ form.email }}
    </div>

    <div>
        <label>Select Account Type:</label><br>
        {{ form.role }}
    </div>

    <div>
        <label>Password:</label><br>
        {{ form.password1 }}
    </div>

    <div>
        <label>Confirm Password:</label><br>
        {{ form.password2 }}
    </div>

    <button type="submit">Register</button>
</form>

{% endblock %}
