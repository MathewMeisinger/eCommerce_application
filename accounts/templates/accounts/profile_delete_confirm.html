{% extends 'base.html' %}

{% block title %}{% endblock %}

{% block content %}
<h1>Delete Account</h1>

<p>Are you sure you want to delete your account? This action cannot be undone.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete my account</button>
</form>

<a href="{% url 'profile_view' %}">Cancel</a>
{% endblock %}
