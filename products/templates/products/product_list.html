{% extends 'base.html' %}

{% block title %}
    <h1>All Products</h1>
{% endblock %}

{% block content %}
    {% for product in products %}
        <div>
            <a href="{% url 'product_detail' product.id %}">
                {{ product.name }} - R{{product.price }}
            </a>
        </div>
    {% endfor %}
{% endblock %}
