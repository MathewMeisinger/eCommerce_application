{% extends 'base.html' %}

{% block title %}{% endblock %}

{% block content %}
<h1>Delete Store</h1>

<p>Are you sure you want to delete your store? This action cannot be undone.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete my store</button>
</form>

<a href="{% url 'vendor-stores' %}">Cancel</a>
{% endblock %}
